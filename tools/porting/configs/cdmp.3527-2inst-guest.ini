; Minimal first native two-instance test for CrimsonDesert.exe 1.0.0.3527 and 1.0.0.3549 (the same layout).
; Use with scripts/launch-2inst.ps1 -GuestIni <this file> and an existing slot,
; for example -GuestSlot slot0, slot1, slot2, slot100 or slot101.

[general]
player_name=Guest3527
startup_delay_ms=0
background_full_speed=1

[net]
enabled=1
transport=udp
role=guest
peer_host=127.0.0.1
peer_port=37015
send_rate_hz=20

[overlay]
enabled=1
self_marker=0

[sniffer]
enabled=1
record=1

[coop]
enabled=0

[dev]
clone_hotkeys=0
combat_tests=0
minimap_cycle=0
aggro_test=0
enemy_relay=0
piece4_test=0
attack_probe=0

[session2]
; Market stalls (build 3549): during the guest's press on a world object the host controls (actor type 7), the
; object counts as the guest's, so "Buy" (hold E) and "Carry" reach the server. 0 = off.
interact_gate=1
interact_gate_errors=
; Shops (build 3549): the guest's buy/sell passes the shop-scene test (host: at its server; guest: in its UI).
store_gate=1
; Shopkeepers (build 3549, 2026-11-06): the guest's own copy of the shop scene, answered here as the server answers the
; host (menu, Buy, Sell, Leave). Needs interact_gate types 3,4 (the press) and guest_x_interaction_stage=1 ("R Shop").
guest_shop_branch=5
interact_gate_types=3,4,7
; Ships (3576 and 3663): the host's ship is drawn where the host has it (its ~1 Hz pose, 0.3 s behind and smoothed),
; not where this game's own copy sails. On 3663 also: the ship's wheel is put where the host has it (this game creates
; it 3 m above the deck), and the host standing on the ship (at the wheel) is drawn on this game's copy of the ship.
; probe = measure only; 0 = off.
vehicle_follow=1
; Houses (3576, 2026-11-07): when the host changes its house in the construction mode, this game rebuilds the house
; right away (the host's housing_share_edits=1 sends the changes). 0 = the changes show when the guest joins again.
housing_redraw=1
; Houses (3576, 2026-11-12): with the host's house as this game's own, it leaves the house's door, shutters and
; furniture to the host's game (the owner's handling of them crashed it when the host opened the construction mode).
housing_gimmick_guard=1
enabled=1
guest=1
guest_mode=remote
probe=1

; Host-only stages must remain zero in the guest process.
create_session=0
accept_tunnel=0
share_field=0
relay_fix=0
mirror_host=0
identity_fix=0
child_hold=0
observer_hold=0

; The CDMP_ROLE=guest process uses save_cdmp_guest; the launcher seeds it from
; the selected slot after making a checked backup. The native title refresh
; uses the verified 3527 slot layout and enables Continue from that copy.
save_guard=redirect
guest_slot_refresh_test=0
guest_own_save=1

; Required lifecycle behavior. The current 2002 mode scalar is verified.
clock_gate=1
guest_goodbye_end=1
reconnect=1
rejoin=1
tunnel_compress=1
c4_safe_reads=0

; Explicitly neutralize parser defaults that can otherwise enable behavior.
user2_loading_owner_alias=0
ride_dismount=native
observer_seq_copy_2322=0
guest_x_camera_veto=0
guest_local_after_remote=allow

; Keep both native character guards; optional legacy probes stay off.
guest_actor_diag=0
guest_layer_guard=1
guest_s3_diag=0
guest_crash_dump=1
guest_update_guard=1
load_diag=0
s1_diag=0
guest_stage_diag=0
guest_scene_diag=0
ui_pause_block=1
